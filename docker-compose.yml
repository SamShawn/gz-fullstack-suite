version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: gz_pg
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: gz_suite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gz_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  pgdata:
