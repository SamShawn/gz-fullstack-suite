version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gz_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: gz_suite
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gz_redis
    ports:
      - '6379:6379'

volumes:
  pgdata:
